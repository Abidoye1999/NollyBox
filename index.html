async function sb(path,options={}){const headers={'apikey':SUPABASE_KEY,'Content-Type':'application/json',...(options.headers||{})};if(session?.access_token)headers.Authorization='Bearer '+session.access_token;const r=await fetch(SUPABASE_URL+path,{...options,headers});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}

 {id:6,slug:'freedom-way',t:'Freedom Way',g:'Action',r:'7.5',img:'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=500&q=80',demo:true}];

function metaText(m){const parts=[];if(m.year)parts.push(m.year);if(m.g)parts.push(m.g);if(m.duration)parts.push(fmt(m.duration*60));return parts.join(' • ')} function detailMeta(m){const parts=[];if(m.year)parts.push(m.year);if(m.g)parts.push(m.g);if(m.duration)parts.push(fmt(m.duration*60));if(m.age)parts.push(m.age);return parts} function poster(m){const premium=!!m.is_premium;const meta=metaText(m);return `<div class="card" onclick=\"detail(${JSON.stringify(m.id).replace(/"/g,'&quot;')})\"><div class="poster" style="background-image:url('${esc(m.img)}')">${premium?'<span class="premiumMark">PREMIUM</span>':''}<span class="rating">★ ${esc(m.r||'0')}</span></div><div class="title">${esc(m.t)}</div><div class="sub">${esc(meta)}</div></div>`}
function avatarUrl(){return session?.profile?.avatar_url||''} function avatarHtml(size=42){let u=avatarUrl();return u?`<img class="avatar" style="width:${size}px;height:${size}px" src="${esc(u)}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="avatar" style="width:${size}px;height:${size}px;display:${u?'none':'grid'};place-items:center">👤</span>`:`<span class="avatar" style="width:${size}px;height:${size}px;display:grid;place-items:center">👤</span>`} function home(){let featured=movies.find(m=>m.remote)||movies[0];let featuredMeta=metaText(featured)||'Nigerian Cinema';let featuredBackdrop=featured.backdrop||featured.img;return `<div class="top"><div class="logo">NollyBox</div><div class="icons"><button class="icon" onclick="go(2)">⌕</button><button class="avatarBtn" onclick="profile()">${avatarHtml(42)}</button></div></div><div class="hero" style="background-image:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.9)),url('${esc(featuredBackdrop)}')"><div class="heroText"><div class="muted">FEATURED • ${esc(featuredMeta)}</div><h1>${esc(featured.t)}</h1><div class="muted">${esc(featured.genres?.length?featured.genres.join(' • '):(featured.g||'Nigerian Cinema'))}</div><div class="actions"><button class="primary" onclick='detail(${JSON.stringify(featured.id)})'>▶ Watch Now</button><button class="secondary" onclick='toggleList(${JSON.stringify(featured.id)})'>＋ My List</button></div></div></div>${!session?.profile?.is_premium?`<div class="adbox">ADVERTISEMENT<br><span style="font-size:10px">Free viewing helps keep NollyBox accessible.</span></div>`:''}${section('🔥 Trending Now',movies.slice(0,4),'trending')}${section('🆕 New Releases',movies.slice(0,8),'new')}`}

function moviesPage(filter='all'){

"actions"><button class="primary" style="flex:1" onclick='play(${JSON.stringify(id)})'>▶ Watch Now</button>${m.trailer?`<button class="secondary" style="flex:1" onclick='trailer(${JSON.stringify(id)})'>▷ Trailer</button>`:''}</div><div class="actions"><button class="secondary" style="flex:1" onclick='downloadMovie(${JSON.stringify(id)})'>⇩ Download</button><button class="secondary" style="flex:1" onclick='toggleList(${JSON.stringify(id)})'>＋ My List</button></div><div class="movieMeta">${meta.map(x=>`<span>${esc(x)}</span>`).join('')}</div><h2>About this movie</h2><p class="muted" style="line-height:1.65">${esc(m.synopsis||'No synopsis available yet.')}</p>${m.director?`<div class="listItem"><b>Director</b><div class="sub">${esc(m.director)}</div></div>`:''}${m.cast?.length?`<h2>Cast</h2><div class="row">${m.cast.slice(0,8).map(x=>`<div style="min-width:82px;text-align:center"><div style="width:58px;height:58px;border-radius:50%;margin:auto;background:#27313b;display:grid;place-items:center">🎭</div><div class="sub">${esc(x)}</div></div>`).join('')}</div>`:''}${m.demo?'<div class="listItem"><b>DEMO CONTENT</b><div class="sub">This title uses test footage and is not the actual movie.</div></div>':''}${similar.length?`<h2>More like this</h2><div class="row">${similar.map(poster).join('')}</div>`:''}</div>`}async function saveProgress(id,seconds,duration,completed=false){progress[id]={seconds,duration,completed,updatedAt:Date.now()};localStorage.setItem('nollyProgress',JSON.stringify(progress));const m=get(id);if(session?.user?.id && m.remote){try{await sb('/rest/v1/watch_history?on_conflict=user_id,movie_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify({user_id:session.user.id,movie_id:m.id,progress_seconds:Math.floor(seconds),completed,last_watched_at:new Date().toISOString()})})}catch(e){console.warn('history sync failed',e)}}}
async function loadWatchHistory(){if(!session?.user?.id)return;try{const rows=await sb('/rest/v1/watch_history?select=movie_id,progress_seconds,completed,last_watched_at&user_id=eq.'+encodeURIComponent(session.user.id)+'&order=last_watched_at.desc');for(const r of rows){const m=movies.find(x=>x.id==r.movie_id);if(m){progress[r.movie_id]={seconds:Number(r.progress_seconds)||0,duration:progress[r.movie_id]?.duration||0,completed:Boolean(r.completed),updatedAt:new Date(r.last_watched_at||0).getTime()||Date.now()}}}localStorage.setItem('nollyProgress',JSON.stringify(progress))}catch(e){console.warn('watch history load failed',e)}}

function trailer(id){let m=get(id);if(!m?.trailer){toast('No trailer available yet');return}document.getElementById('app').innerHTML=`<div class="page"><button class="back" onclick='detail(${JSON.stringify(id)})'>‹</button><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.08em">TRAILER</div><h2 style="margin:4px 0 12px">${esc(m.t)}</h2><video class="realvideo" controls playsinline preload="metadata" src="${esc(m.trailer)}"></video><p class="muted" style="font-size:12px;margin-top:12px">Official NollyBox trailer. The trailer is separate from the full movie stream.</p><button class="primary" onclick='detail(${JSON.stringify(id)})'>Back to movie</button></div>`;nav()}
const NB_DB='nollybox_offline_v1';
const NB_DB_VERSION=3;
function openOfflineDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(NB_DB,NB_DB_VERSION);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('movies'))db.createObjectStore('movies',{keyPath:'id'});};r.onsuccess=()=>{const db=r.result;if(!db.objectStoreNames.contains('movies')){db.close();try{indexedDB.deleteDatabase(NB_DB)}catch(_){}reject(new Error('Offline storage needs reset. Please try Download again.'));return}resolve(db)};r.onerror=()=>reject(r.error||new Error('Could not open offline storage'))})}
async function offlinePut(record){const db=await openOfflineDB();return new Promise((resolve,reject)=>{const tx=db.transaction('movies','readwrite');tx.objectStore('movies').put(record);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error||new Error('Could not save offline movie'))}})}
async function offlineGet(id){const db=await openOfflineDB();return new Promise((resolve,reject)=>{const tx=db.transaction('movies','readonly');const r=tx.objectStore('movies').get(String(id));r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error);tx.oncomplete=()=>db.close()})}
async function offlineDelete(id){const db=await openOfflineDB();return new Promise((resolve,reject)=>{const tx=db.transaction('movies','readwrite');tx.objectStore('movies').delete(String(id));tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function offlineKey(){try{let raw=localStorage.getItem('nollyOfflineKey');if(!raw){const key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);const bytes=new Uint8Array(await crypto.subtle.exportKey('raw',key));raw=btoa(String.fromCharCode(...bytes));localStorage.setItem('nollyOfflineKey',raw)}const bytes=Uint8Array.from(atob(raw),c=>c.charCodeAt(0));return await crypto.subtle.importKey('raw',bytes,{name:'AES-GCM'},false,['encrypt','decrypt'])}catch(e){throw new Error('Secure offline storage is unavailable on this browser')}}
async function encryptBlob(blob){const key=await offlineKey();const iv=crypto.getRandomValues(new Uint8Array(12));const data=await blob.arrayBuffer();const enc=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,data);return {data:new Blob([enc],{type:'application/octet-stream'}),iv:Array.from(iv),type:blob.type,size:blob.size}}
async function decryptRecord(rec){const key=await offlineKey();const enc=await rec.data.arrayBuffer();const dec=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(rec.iv)},key,enc);return new Blob([dec],{type:rec.type||'video/mp4'})}
async function downloadMovie(id){const m=get(id);if(!m){toast('Movie not found');return}if(downloads.includes(id)){toast('Already downloaded');return}if(!m.demo&&!session?.access_token){toast('Please sign in to download this movie');return}let src='';try{downloadState[id]=0;go(4);toast('Preparing download…');if(m.demo){src=TEST_VIDEO}else{const playback=async()=>{const r=await fetch(SUPABASE_URL+'/functions/v1/nollybox-playback',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({movie_id:m.id})});let d={};try{d=await r.json()}catch(_){}if(!r.ok)throw new Error(d.error||('Download authorization failed ('+r.status+')'));return d.url};try{src=await playback()}catch(e){if(/expired|invalid session|401|jwt/i.test(String(e.message||e))&&await refreshSession())src=await playback();else throw e}}const r=await fetch(src);if(!r.ok)throw new Error('Could not download the movie');const total=Number(r.headers.get('content-length'))||0;const reader=r.body?.getReader();let chunks=[],received=0;if(reader){while(true){const {done,value}=await reader.read();if(done)break;chunks.push(value);received+=value.byteLength;downloadState[id]=total?Math.round(received/total*100):Math.min(95,downloadState[id]+5);downloadsPageRender()}}else{chunks=[new Uint8Array(await r.arrayBuffer())];downloadState[id]=95}const blob=new Blob(chunks,{type:r.headers.get('content-type')||'video/mp4'});const encrypted=await encryptBlob(blob);await offlinePut({id:String(id),title:m.t,poster:m.img,createdAt:Date.now(),data:encrypted.data,iv:encrypted.iv,type:encrypted.type,size:encrypted.size});downloads.push(id);localStorage.setItem('nollyDown',JSON.stringify(downloads));delete downloadState[id];toast('Download complete — available offline');downloadsPageRender()}catch(e){delete downloadState[id];toast('Download failed: '+(e.message||'Please try again'));downloadsPageRender()}}
let offlineObjectUrl='';
window.openOfflineByButton=function(btn){try{const id=btn&&btn.dataset?btn.dataset.offlineId:''; if(!id){toast('Offline movie ID missing');return false;} openOffline(id);}catch(e){toast('Could not open offline movie: '+(e.message||e));} return false};
function openOffline(id){
  const m=get(id);
  if(!m){toast('Offline movie not found in catalogue');return}
  current=4;
  document.getElementById('app').innerHTML=`<div class="page"><button class="back" onclick="go(4)">‹</button><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.08em">PROTECTED OFFLINE</div><h2 style="margin:3px 0 10px">${esc(m.t)}</h2><video id="offlineVideo" class="realvideo" controls playsinline preload="auto"></video><div class="muted" id="offlineStatus" style="margin-top:8px">Opening protected offline copy…</div><button id="offlinePlayBtn" class="primary" style="width:100%;margin-top:12px" type="button" disabled>Decrypting…</button><p class="muted" style="font-size:12px;margin-top:12px">The movie is decrypted only inside NollyBox for offline viewing.</p></div>`;
  nav();
  const v=document.getElementById('offlineVideo'), st=document.getElementById('offlineStatus'), btn=document.getElementById('offlinePlayBtn');
  let objectUrl='';
  const fail=(msg)=>{st.textContent=msg;btn.disabled=false;btn.textContent='↻ Try Again';toast(msg)};
  v.addEventListener('error',()=>{const e=v.error;fail('Playback error'+(e?` (${e.code}) ${e.message||''}`:' (unknown browser error)'))});
  v.addEventListener('loadedmetadata',()=>{st.textContent=`Offline video ready • ${fmt(v.duration)}`;btn.disabled=false;btn.textContent='▶ Play Offline';const last=progress[id]?.seconds||0;if(last>0&&last<v.duration-5)v.currentTime=last});
  v.addEventListener('canplay',()=>{if(v.paused){st.textContent=`Ready to play • ${fmt(v.duration||0)}`;btn.disabled=false;btn.textContent='▶ Play Offline'}});
  v.addEventListener('play',()=>{st.textContent='Playing offline';btn.disabled=false;btn.textContent='⏸ Pause';});
  v.addEventListener('playing',()=>{st.textContent='Playing offline';btn.disabled=false;btn.textContent='⏸ Pause';});
  v.addEventListener('pause',()=>{if(!v.ended){st.textContent=`Paused • ${fmt(v.currentTime)} / ${fmt(v.duration||0)}`;btn.disabled=false;btn.textContent='▶ Resume Offline';saveProgress(id,v.currentTime,v.duration,false);}});
  v.addEventListener('ended',()=>{st.textContent='Finished offline';btn.disabled=false;btn.textContent='↺ Play Again';saveProgress(id,v.duration,v.duration,true);});
  btn.onclick=()=>{try{if(v.ended){v.currentTime=0;} if(v.paused){btn.disabled=true;btn.textContent='Starting…';st.textContent='Starting offline playback…';const p=v.play();if(p&&p.catch)p.catch(e=>fail('Playback failed: '+(e.message||'The browser could not start the offline video')));}else{v.pause();}}catch(e){fail('Playback failed: '+(e.message||'The browser could not start the offline video'))}};
  (async()=>{try{
    st.textContent='Decrypting protected movie…';
    const rec=await offlineGet(id);
    if(!rec)throw new Error('Offline copy is missing');
    const blob=await decryptRecord(rec);
    if(!blob||blob.size<1)throw new Error('Offline movie data is empty');
    objectUrl=URL.createObjectURL(blob);
    v.src=objectUrl;
    v.load();
    st.textContent='Preparing offline video…';
  }catch(e){fail('Offline preparation failed: '+(e.message||'unknown error'))}})();
  window._offlineCleanup=()=>{if(objectUrl)URL.revokeObjectURL(objectUrl)};
}

async function play(id,offlineSrc='',isOffline=false){let m=get(id),isDemo=!!m.demo,src=offlineSrc,last=progress[id]?.seconds||0;
if(!isDemo){
 if(!session?.access_token){toast('Please sign in to watch this movie');return}
 if(!isOffline && !m.video){toast('No full movie is attached yet');return}

 if(!isOffline){
 try{
   const playback=async()=>{const r=await fetch(SUPABASE_URL+'/functions/v1/nollybox-playback',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({movie_id:m.id})});let data={};try{data=await r.json()}catch(_){}if(!r.ok)throw new Error(data.error||('Playback request failed ('+r.status+')'));return data.url};
   try{src=await playback()}catch(e){
     const msg=String(e.message||e);

 }catch(e){

   if(/Premium subscription required/i.test(msg)){
     document.getElementById('app').innerHTML=`<div class="page"><button class="back" onclick='detail(${JSON.stringify(id)})'>‹</button><div class="premium"><div class="premiumBadge">PREMIUM MOVIE</div><h1 style="margin:10px 0 6px">Premium required</h1><p class="muted">${esc(m.t)} is available to NollyBox Premium members.</p><div class="feature">✓ No advertisements</div><div class="feature">✓ Premium movie catalogue</div><div class="feature">✓ HD / Full HD where available</div><button class="primary" style="width:100%;margin-top:14px" onclick="premium()">Upgrade to Premium</button><button class="secondary" style="width:100%;margin-top:8px" onclick='detail(${JSON.stringify(id)})'>Back to movie</button></div></div>`;
     nav();
     return;
   }
   toast(msg||'Could not start playback');
   return;
 }
 }
}else if(!isOffline){src=TEST_VIDEO}
document.getElementById('app').innerHTML=`<div class="page"><button class="back" onclick='detail(${JSON.stringify(id)})'>‹</button><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 10px"><div><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.08em">${isDemo?'DEMO CONTENT':'NOW PLAYING'}</div><h2 style="margin:3px 0 0">${m.t}</h2></div>${isDemo?'<span class="pill" style="background:#5a2024;color:#ff8b90">Demo</span>':''}</div><video id="video" class="realvideo" controls playsinline preload="metadata" src="${esc(src)}"></video><div class="muted" id="watchStatus">Loading…</div>${isDemo?`<div style="margin-top:12px;padding:12px;background:#151c25;border:1px solid #293541;border-radius:10px;font-size:12px"><b>Demo footage:</b> ${TEST_VIDEO_TITLE}. ${TEST_VIDEO_NOTE}</div>`:''}<p class="muted" style="font-size:12px;margin-top:12px">${isDemo?'When NollyBox has licensed rights, this placeholder will be replaced by the correct movie stream.':'Licensed NollyBox content is delivered through secure video delivery. This playback link expires automatically.'}</p><button class="primary" onclick='detail(${JSON.stringify(id)})'>Back to movie</button></div>`;nav();const v=document.getElementById('video');const st=document.getElementById('watchStatus');v.addEventListener('loadedmetadata',()=>{if(last>0 && last<v.duration-5){v.currentTime=last}st.textContent=`${fmt(v.currentTime)} / ${fmt(v.duration)}`});v.addEventListener('timeupdate',()=>{st.textContent=`${fmt(v.currentTime)} / ${fmt(v.duration)}`;if(Math.floor(v.currentTime)%5===0)saveProgress(id,v.currentTime,v.duration,false)});v.addEventListener('pause',()=>saveProgress(id,v.currentTime,v.duration,false));v.addEventListener('ended',()=>saveProgress(id,v.duration,v.duration,true))}
function fmt(sec){if(!Number.isFinite(sec))return '0:00';sec=Math.floor(sec);return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function downloadsPage(){
  const saved=downloads.map(id=>get(id)).filter(Boolean);

  const ready=saved.filter(m=>downloadState[m.id]==null);
  const card=m=>`<div class="listItem" style="padding:12px;align-items:center">
    <div class="thumb" style="background-image:url('${esc(m.img)}')"></div>

      <b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.t)}</b>
      ${downloadState[m.id]!=null?`<div class="sub">Downloading… ${downloadState[m.id]}%</div><div class="downloadBar"><i style="width:${downloadState[m.id]}%"></i></div>`:`<div class="sub">🔒 Protected offline • Ready to watch</div>`}
    </div>
    ${downloadState[m.id]==null?`<button class="secondary offlinePlay" type="button" data-offline-id="${esc(m.id)}" onclick="window.openOfflineByButton(this)" aria-label="Play offline">${'▶'}</button>`:''}
  </div>`;
  return `<div class="page">
    <h1>Downloads</h1>
    <div class="premium" style="margin-bottom:14px;padding:15px">
      <div style="display:flex;align-items:center;gap:12px"><div style="font-size:28px">⇩</div><div><b>Watch offline</b><div class="sub">Your protected downloads stay inside NollyBox for offline playback.</div></div></div>
    </div>
    ${active.length?`<div class="section" style="padding:0;margin:16px 0"><div class="sectionHead"><h2>Downloading</h2><span class="muted" style="font-size:12px">${active.length}</span></div><div class="list">${active.map(card).join('')}</div></div>`:''}
    <div class="section" style="padding:0;margin:16px 0"><div class="sectionHead"><h2>Downloaded</h2><span class="muted" style="font-size:12px">${ready.length}</span></div>${ready.length?`<div class="list">${ready.map(card).join('')}</div>`:`<div class="empty"><div style="font-size:42px;margin-bottom:8px">⇩</div><b>No offline movies yet</b><p class="muted">Open a movie and tap Download to save a protected copy for offline viewing.</p></div>`}</div>
    ${saved.length?`<div class="listItem" style="margin-top:18px"><div style="font-size:20px">🔒</div><div><b>Protected offline storage</b><div class="sub">Downloads are encrypted inside NollyBox and are not saved as ordinary video files.</div></div></div>`:''}
  </div>`;
}

async function loadProfile(){if(!session?.user?.id)return;try{const rows=await sb('/rest/v1/profiles?select=display_name,avatar_url,is_premium,premium_until&id=eq.'+encodeURIComponent(session.user.id));session.profile=rows[0]||null;localStorage.setItem('nollySession',JSON.stringify(session))}catch(e){console.warn('profile load failed',e)}}
async function uploadAvatar(){if(!session?.user?.id){toast('Please sign in first');return}await ensureProfile();const input=document.getElementById('avatarFile');const file=input?.files?.[0];if(!file){toast('Choose a picture first');return}const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=session.user.id+'/'+Date.now()+'.'+ext;try{const h={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+session.access_token,'Content-Type':file.type||'image/jpeg','x-upsert':'true'};const r=await fetch(SUPABASE_URL+'/storage/v1/object/avatars/'+path,{method:'POST',headers:h,body:file});if(!r.ok)throw new Error(await r.text());const url=SUPABASE_URL+'/storage/v1/object/public/avatars/'+path+'?v='+Date.now();const saved=await sb('/rest/v1/profiles?id=eq.'+encodeURIComponent(session.user.id),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({avatar_url:url})});if(!saved?.length)throw new Error('Profile record was not updated');session.profile={...(session.profile||{}),avatar_url:url};localStorage.setItem('nollySession',JSON.stringify(session));await loadProfile();toast('Profile picture uploaded successfully');go(5)}catch(e){toast('Could not upload picture: '+e.message)}}

function auth(){document.getElementById('app').innerHTML=`<div class="page"><button class="back" onclick="go(5)">‹</button><h1>Welcome to NollyBox</h1><p class="muted">Sign in or create your account.</p><div class="actions" style="display:flex;gap:8px"><button id="emailTab" class="primary" onclick="authMethod('email')">Email</button><button id="phoneTab" class="secondary" onclick="authMethod('phone')">Phone number</button></div><div id="emailAuth"><input id="email" placeholder="Email" type="email" autocomplete="email" style="width:100%;background:#161e28;border:1px solid #27323f;border-radius:12px;color:white;padding:13px;margin:8px 0"><input id="password" placeholder="Password" type="password" autocomplete="current-password" style="width:100%;background:#161e28;border:1px solid #27323f;border-radius:12px;color:white;padding:13px;margin:8px 0"><div class="actions"><button class="primary" onclick="login(false)">Sign In</button><button class="secondary" onclick="login(true)">Create Account</button></div></div><div id="phoneAuth" style="display:none"><p class="muted" style="font-size:13px">Use a phone number you can receive SMS on.</p><input id="phoneNumber" placeholder="+234 801 234 5678" type="tel" autocomplete="tel" style="width:100%;background:#161e28;border:1px solid #27323f;border-radius:12px;color:white;padding:13px;margin:8px 0"><div id="phoneOtpWrap" style="display:none"><input id="phoneOtp" placeholder="6-digit SMS code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" style="width:100%;background:#161e28;border:1px solid #27323f;border-radius:12px;color:white;padding:13px;margin:8px 0"></div><div class="actions"><button id="sendPhoneOtpBtn" class="primary" onclick="sendPhoneOtp()">Send SMS code</button><button id="verifyPhoneOtpBtn" class="secondary" style="display:none" onclick="verifyPhoneOtp()">Verify code &amp; Sign In</button></div><p class="muted" style="font-size:12px">SMS sign-in requires phone authentication and an SMS provider to be enabled for NollyBox.</p></div><p class="muted" style="font-size:12px">Your account is handled by NollyBox's authentication service.</p></div>`}
function authMethod(method){const email=method==='email';const e=document.getElementById('emailAuth'),p=document.getElementById('phoneAuth'),et=document.getElementById('emailTab'),pt=document.getElementById('phoneTab');if(e)e.style.display=email?'block':'none';if(p)p.style.display=email?'none':'block';if(et){et.className=email?'primary':'secondary'}if(pt){pt.className=email?'secondary':'primary'}}
function normalizeNollyPhone(raw){let p=String(raw||'').trim().replace(/[\s()-]/g,'');if(p.startsWith('00'))p='+'+p.slice(2);if(p.startsWith('0'))p='+234'+p.slice(1);else if(/^234\d{10}$/.test(p))p='+'+p;else if(/^\d{10}$/.test(p))p='+234'+p;return p}
async function sendPhoneOtp(){const input=document.getElementById('phoneNumber');const phone=normalizeNollyPhone(input?.value);if(!phone||!/^\+[1-9]\d{7,14}$/.test(phone)){toast('Enter a valid phone number with country code, e.g. +2348012345678');return}const btn=document.getElementById('sendPhoneOtpBtn');if(btn){btn.disabled=true;btn.textContent='Sending…'}try{await sb('/auth/v1/otp',{method:'POST',body:JSON.stringify({phone,create_user:true})});window.nollyPendingPhone=phone;const wrap=document.getElementById('phoneOtpWrap'),verify=document.getElementById('verifyPhoneOtpBtn');if(wrap)wrap.style.display='block';if(verify)verify.style.display='block';if(input)input.readOnly=true;toast('SMS code requested. Check your messages.')}catch(e){let msg=String(e.message||'Could not send SMS code');try{const j=JSON.parse(msg);msg=j.msg||j.message||j.error_description||j.error||msg}catch(_){}const l=msg.toLowerCase();if(l.includes('phone provider is not enabled')||l.includes('phone signups are disabled')||l.includes('sms provider'))msg='Phone sign-in is not enabled yet. Supabase phone auth and an SMS provider must be configured.';toast(msg);console.error('NollyBox phone OTP error:',e)}finally{if(btn){btn.disabled=false;btn.textContent='Send SMS code'}}}
async function verifyPhoneOtp(){const phone=window.nollyPendingPhone;const token=String(document.getElementById('phoneOtp')?.value||'').trim();if(!phone){toast('Request an SMS code first');return}if(!/^\d{6}$/.test(token)){toast('Enter the 6-digit code from your SMS');return}const btn=document.getElementById('verifyPhoneOtpBtn');if(btn){btn.disabled=true;btn.textContent='Verifying…'}try{const r=await sb('/auth/v1/verify',{method:'POST',body:JSON.stringify({phone,token,type:'sms'})});session=r;localStorage.setItem('nollySession',JSON.stringify(r));await ensureProfile();await loadProfile();await checkAdmin();window.nollyPendingPhone=null;toast('Phone verified. Signed in');go(5)}catch(e){let msg=String(e.message||'Could not verify SMS code');try{const j=JSON.parse(msg);msg=j.msg||j.message||j.error_description||j.error||msg}catch(_){}toast(msg);console.error('NollyBox phone verification error:',e)}finally{if(btn){btn.disabled=false;btn.textContent='Verify code & Sign In'}}}
async function login(signup){
  const email=document.getElementById('email')?.value.trim();
  const password=document.getElementById('password')?.value||'';
  if(!email||!password){toast('Enter your email and password');return}
  const btn=[...document.querySelectorAll('.actions button')].find(b=>b.textContent.includes(signup?'Create Account':'Sign In'));
  if(btn){btn.disabled=true;btn.textContent=signup?'Creating…':'Signing in…'}
  try{
    if(signup){
      await sb('/auth/v1/signup?redirect_to='+encodeURIComponent('https://abidoye1999.github.io/NollyBox/'),{method:'POST',body:JSON.stringify({email,password})});
      toast('Account created. Check your email if confirmation is required.');
    }else{
      let r;
      try{
        r=await sb('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});
      }catch(firstError){
        const msg=String(firstError?.message||'');
        if(msg.includes('401')||msg.includes('PGRST303')||msg.toLowerCase().includes('jwt expired')) throw firstError;
        throw firstError;
      }
      session=r;
      localStorage.setItem('nollySession',JSON.stringify(r));
      await ensureProfile();
      await loadProfile();
      await checkAdmin();
      toast('Signed in');
      go(5);
    }
  }catch(e){
    const raw=String(e?.message||e||'');
    let msg='Could not complete that request';
    try{
      const parsed=JSON.parse(raw);
      const detail=parsed?.msg||parsed?.message||parsed?.error_description||parsed?.error;
      if(detail) msg=String(detail);
    }catch(_){}
    const lower=msg.toLowerCase();
    if(lower.includes('invalid login credentials')) msg='Incorrect email or password.';
    else if(lower.includes('email not confirmed')) msg='Please confirm your email before signing in.';
    else if(lower.includes('email rate limit')) msg='Too many attempts. Please wait a moment and try again.';
    else if(lower.includes('user already registered')) msg='This email already has an account. Tap Sign In instead.';
    else if(lower.includes('network')||lower.includes('failed to fetch')) msg='Connection problem. Check your internet and try again.';
    toast(msg);
    console.error('NollyBox authentication error:',e);
  }finally{
    if(btn){btn.disabled=false;btn.textContent=signup?'Create Account':'Sign In'}
  }
}
async function ensureProfile(){if(!session?.user?.id)return;try{await sb('/rest/v1/profiles',{method:'POST',headers:{Prefer:'resolution=ignore-duplicates'},body:JSON.stringify({id:session.user.id,display_name:session.user.email})})}catch(e){console.warn(e)}}
async function logout(){try{await sb('/auth/v1/logout',{method:'POST'})}catch(e){}session=null;localStorage.removeItem('nollySession');toast('Logged out');go(1)}


async function refreshSession(){if(!session?.refresh_token)return false;try{const r=await sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:session.refresh_token})});if(r?.access_token){session={...session,...r,user:r.user||session.user};localStorage.setItem('nollySession',JSON.stringify(session));return true}}catch(e){}return false}
async function checkAdmin(){
 if(!session?.access_token){admin=false;return false}
 try{
   const r=await sb('/rest/v1/rpc/is_nollybox_admin',{method:'POST',headers:{Prefer:'return=representation'},body:'{}'});
   admin=!!r; return admin;
 }catch(e){
   const msg=String(e.message||'');
   if((msg.includes('401')||msg.includes('PGRST303')||msg.toLowerCase().includes('jwt expired')) && await refreshSession()){
     try{const r=await sb('/rest/v1/rpc/is_nollybox_admin',{method:'POST',headers:{Prefer:'return=representation'},body:'{}'});admin=!!r;return admin}catch(_){}
   }
   admin=false; return false;
 }
}
async function uploadMedia(bucket,inputId){if(!admin)return null;const input=document.getElementById(inputId);if(!input?.files?.[0]){toast('Choose a file first');return null}const file=input.files[0];const ext=(file.name.split('.').pop()||'bin').toLowerCase();const safe=(file.name.replace(/[^a-zA-Z0-9._-]/g,'-').replace(/\.+/g,'.'));const path=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'-'+safe;try{const h={'apikey':SUPABASE_KEY,'Content-Type':file.type||'application/octet-stream','x-upsert':'false'};if(session?.access_token)h.Authorization='Bearer '+session.access_token;const r=await fetch(SUPABASE_URL+'/storage/v1/object/'+bucket+'/'+path,{method:'POST',headers:h,body:file});if(!r.ok)throw new Error(await r.text());const url=bucket==='movie-videos' ? 'storage://movie-videos/'+path : SUPABASE_URL+'/storage/v1/object/public/'+bucket+'/'+path;if(bucket==='movie-videos'){toast('Movie uploaded to private storage. Save the movie to enable secure playback.')}else{toast('Media uploaded')}return url}catch(e){toast('Upload failed: '+e.message);return null}}
async function uploadInto(fieldId,bucket,inputId){const url=await uploadMedia(bucket,inputId);if(url){const el=document.getElementById(fieldId);if(el)el.value=url}}

}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function movieBody(){const v=id=>document.getElementById(id)?.value.trim();const title=v('a_title');if(!title){toast('Movie title is required');return null}let slug=v('a_slug')||title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');slug=slug.toLowerCase().replace(/[^a-z0-9-]/g,'').replace(/-+/g,'-').replace(/(^-|-$)/g,'');if(!slug){toast('Please enter a valid movie slug');return null}return {title,slug,synopsis:v('a_synopsis'),poster_url:v('a_poster')||null,backdrop_url:v('a_backdrop')||null,trailer_url:v('a_trailer')||null,video_url:v('a_video')||null,year:Number(v('a_year'))||new Date().getFullYear(),duration_minutes:Number(v('a_duration'))||0,genre:v('a_genre').split(',').map(x=>x.trim()).filter(Boolean),language:'English',country:'Nigeria',rating:Number(v('a_rating'))||0,is_premium:document.getElementById('a_premium').checked,is_demo:document.getElementById('a_demo').checked,is_published:document.getElementById('a_published').checked,cast_names:v('a_cast').split(',').map(x=>x.trim()).filter(Boolean),director:v('a_director'),age_rating:v('a_age')||'13+'}}
async function addMovie(){if(!admin)return;const body=movieBody();if(!body)return;try{const existing=await sb('/rest/v1/movies?select=id&slug=eq.'+encodeURIComponent(body.slug));if(existing.length){toast('That slug already exists. Choose a different slug.');return}await sb('/rest/v1/movies',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});toast('Movie added successfully');await loadRemoteMovies();await adminStudio()}catch(e){toast(e.message?.includes('23505')?'That slug already exists. Choose a different slug.':'Could not add movie: '+e.message)}}
async function updateMovie(id){if(!admin)return;const body=movieBody();if(!body)return;try{const existing=await sb('/rest/v1/movies?select=id&slug=eq.'+encodeURIComponent(body.slug)+'&id=neq.'+encodeURIComponent(id));if(existing.length){toast('That slug belongs to another movie. Choose a different slug.');return}await sb('/rest/v1/movies?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});toast('Movie updated successfully');await loadRemoteMovies();await adminStudio()}catch(e){toast('Could not update movie: '+e.message)}}
async function deleteMovie(id,title){if(!admin)return;if(!confirm('Delete "'+title+'" from the catalogue?'))return;try{await sb('/rest/v1/movies?id=eq.'+encodeURIComponent(id),{method:'DELETE'});toast('Movie deleted');await loadRemoteMovies();await adminStudio()}catch(e){toast('Could not delete movie: '+e.message)}}

function premium(){const isPro=!!session?.profile?.is_premium;const until=session?.profile?.premium_until?new Date(session.profile.premium_until):null;const expiry=until&&!isNaN(until)?until.toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'}):'';document.getElementById('app').innerHTML=`<div class="page"><button class="back" onclick="go(5)">‹</button><div class="premium"><div class="premiumBadge">${isPro?'ACTIVE PREMIUM':'NOLLYBOX PREMIUM'}</div><h1 style="margin:10px 0 6px">${isPro?'Your Premium is active':'Watch more. Watch better.'}</h1><p class="muted">${isPro?'Enjoy your Premium benefits until '+esc(expiry||'your plan end date')+'.':'Upgrade to remove ads and unlock premium movies and protected offline viewing.'}</p><div class="feature">✓ No advertisements</div><div class="feature">✓ HD / Full HD where available</div><div class="feature">✓ More protected offline downloads</div><div class="feature">✓ Premium catalogue</div><div class="feature">✓ Priority access to selected new releases</div>${isPro?`<div class="listItem" style="margin-top:16px"><div><b>Subscription status</b><div class="sub">Premium active${expiry?' • Expires '+esc(expiry):''}</div></div><span class="premiumBadge">ACTIVE</span></div>`: `<h2 style="margin:20px 0 10px">Choose your plan</h2><div class="actions" style="align-items:stretch"><button id="plan_monthly" class="planCard" type="button" onclick="selectPlan('monthly',1500)"><div class="muted">Monthly</div><div class="planPrice">₦1,500</div><div class="sub">per month</div></button><button id="plan_quarterly" class="planCard" type="button" onclick="selectPlan('quarterly',4000)"><div class="muted">3 Months</div><div class="planPrice">₦4,000</div><div class="sub">₦500 savings • 11% off</div><div class="planSave">Best value</div></button></div><div id="planChoice" class="listItem" style="margin-top:12px"><div><b>Select a plan</b><div class="sub">Secure Paystack checkout.</div></div></div><button class="primary" style="width:100%;margin-top:12px" type="button" onclick="startCheckout()">Continue to Payment</button><div id="checkoutStatus"></div>`}<p class="sub" style="margin-top:12px">Payments are securely processed by Paystack. NollyBox does not store your card details.</p></div>${!isPro?'<div class="adbox" style="margin-left:0;margin-right:0;margin-top:14px">FREE PLAN • Ads will appear during eligible free viewing.</div>':''}</div>`;}
let selectedPlan=null;
function selectPlan(code,price){selectedPlan={code,price};document.getElementById('plan_monthly')?.classList.toggle('selected',code==='monthly');document.getElementById('plan_quarterly')?.classList.toggle('selected',code==='quarterly');const el=document.getElementById('planChoice');if(el)el.innerHTML=`<div><b>${code==='monthly'?'Monthly':'3 Months'} selected</b><div class="sub">₦${price.toLocaleString()} • Ready for checkout</div></div><span class="premiumBadge">SELECTED</span>`}
async function startCheckout(){
  if(session?.profile?.is_premium){toast('Premium is already active on this account');return}
  if(!session?.user?.id){toast('Sign in to subscribe');auth();return}
  if(!selectedPlan){toast('Choose a Premium plan first');return}
  const btn=[...document.querySelectorAll('.premium .primary')].find(b=>b.textContent.includes('Payment'));
  if(btn){btn.disabled=true;btn.textContent='Preparing secure checkout…'}
  try{
    const r=await fetch(SUPA+'/functions/v1/nollybox-paystack-init',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':KEY},body:JSON.stringify({plan:selectedPlan.code})});
    const d=await r.json();
    if(!r.ok||!d.authorization_url) throw new Error(d.error||'Could not start Paystack checkout');
    localStorage.setItem('nollyPendingPayment',JSON.stringify({reference:d.reference,plan:selectedPlan.code,startedAt:Date.now()}));
    toast('Secure checkout ready');
    setTimeout(()=>{window.open(d.authorization_url,'_blank');},250);
    const holder=document.getElementById('checkoutStatus');
    if(holder) holder.innerHTML=`<div class="listItem" style="margin-top:12px"><div><b>Payment started</b><div class="sub">Complete Paystack checkout, then return here and tap Verify Payment.</div></div><button class="secondary" type="button" onclick="verifyPayment()">Verify</button></div>`;
  }catch(e){toast(e.message||'Could not start checkout');if(btn){btn.disabled=false;btn.textContent='Continue to Payment'}}
}
async function verifyPayment(){
  const raw=localStorage.getItem('nollyPendingPayment'); if(!raw){toast('No pending payment found');return}
  const pending=JSON.parse(raw);
  toast('Verifying payment…');
  try{
    const r=await fetch(SUPA+'/functions/v1/nollybox-paystack-verify',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':KEY},body:JSON.stringify({reference:pending.reference})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Verification failed');
    if(!d.paid){localStorage.removeItem('nollyPendingPayment'); toast('Payment not completed — Premium was not activated.'); return}
    localStorage.removeItem('nollyPendingPayment');
    await loadProfile();
    toast('Premium activated successfully 🎉');
    go(5);
  }catch(e){toast(e.message||'Could not verify payment')}
}

async function go(n){current=n;if(n===5){checkAdmin();loadWatchHistory()}let html=n===1?home():n===2?search():n===3?moviesPage():n===4?downloadsPage():me();document.getElementById('app').innerHTML=html;nav();window.scrollTo(0,0)}
function toggleList(id){if(watchlist.includes(id))watchlist=watchlist.filter(x=>x!==id);else watchlist.push(id);localStorage.setItem('nollyWatch',JSON.stringify(watchlist));toast(watchlist.includes(id)?'Added to My List':'Removed from My List')}

function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
(async()=>{await checkAdmin();await loadRemoteMovies();await loadWatchHistory();go(1)})()

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
</script></body></html>
